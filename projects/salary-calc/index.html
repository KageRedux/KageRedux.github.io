<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Salary Calculator </title>
    <link rel="stylesheet" href="/css/style.css">
  </head>

  <body>
    <button id="theme-toggle">🌙</button>
    <button id="home-button" onclick="window.location.href='https://kageredux.github.io/'">🏠</button>
    
    <h1> 💼 Salary Calculator </h1>
    <p class="notice">
      Convert your hourly, weekly, or monthly pay into annual income — or vice versa. <br>
      Fast, accurate, and mobile-friendly.
    </p>

    <div class="container">
      <label> Salary Type </label>
      <select id="salary-type">
        <option value="hourly">Hourly</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
        <option value="annual">Annual</option>
      </select>

      <label> Amount ($) </label>
      <input type="number" id="amount" placeholder="e.g. 25" inputmode="decimal">

      <label> Hours per Week (for Hourly pay) </label>
      <input type="number" id="hours-per-week" placeholder="e.g. 40" inputmode="numeric">

      <!-- Acknowledgement checkbox -->
      <label style="margin-top:1rem; display:block;">
        <input type="checkbox" id="acknowledge-limitations">
        I understand this calculator excludes overtime, bonuses, and taxes.
      </label>

      <button id="calculate-btn" disabled> Calculate </button>

      <div class="result" id="result" style="margin-top: 1.5rem;"></div>

      <p class="notice" style="margin-top:1rem; font-size:0.9rem; opacity:0.8;">
        ⚠️ This calculator provides gross pay estimates only. Actual income may vary.
      </p>

      <div class="converter-link" style="text-align:center; margin-top:1rem;">
        🔄 <a href="/projects/budget-calc/index.html"> Go to Budget Calculator </a>
      </div>
    </div>

    <script src="/js/theme.js"></script>
    <script src="/js/salary-calc.js"></script>
  </body>
</html>
